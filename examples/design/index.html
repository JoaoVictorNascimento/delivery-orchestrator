<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery Orchestrator — Design prototype</title><style>
:root{--bg:#10141c;--surface:#191f2b;--border:#303a4a;--text:#e5eaf3;--muted:#a0adc0;--primary:#829fff;--good:#65d6a0;--warn:#f0be72;--bad:#ff9a9a; color-scheme:dark}body.light{--bg:#f5f7fa;--surface:#fff;--border:#dde3eb;--text:#172033;--muted:#536176;--primary:#435fc9;--good:#16663e;--warn:#80500b;--bad:#a62b2b;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--primary)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:2}.brand{font-size:17px;font-weight:650;display:flex;gap:12px;align-items:center}.logo{width:34px;height:34px;color:var(--primary)}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:24px 14px;border-right:1px solid var(--border)}nav button{display:block;text-align:left;width:100%;border:0;background:transparent;margin:4px 0;padding:10px 12px}nav button.active{background:var(--surface);color:var(--primary);box-shadow:inset 2px 0 var(--primary)}main{padding:30px;max-width:1600px;width:100%;margin:auto;align-self:start}h1{font-size:27px;letter-spacing:-.7px;margin:5px 0}h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px}p{margin:6px 0 12px}.muted,small{color:var(--muted)}small{font-size:12px}.mono{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.section{margin-top:24px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;min-width:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:16px}.metric{font-size:30px;font-weight:600;margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{font-size:12px;white-space:normal}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.run{color:var(--primary)}.primary{background:var(--primary);color:var(--bg);font-weight:650;border:0}.line{padding:14px 0;border-top:1px solid var(--border)}.delivery{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--border);border-radius:0;padding:16px 0}.delivery:hover{color:var(--primary)}.node{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}.node.selected{border-color:var(--primary)}.arrow{text-align:center;color:var(--muted);height:23px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.loop{border-left:2px dashed var(--primary);padding:8px 12px;margin:8px 0;color:var(--primary);font-size:12px}.checks label{display:block;padding:10px 0;border-bottom:1px solid var(--border)}input{accent-color:var(--primary)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;background:var(--bg);border:1px solid var(--border);padding:12px;border-radius:6px}.notice{border:1px solid var(--border);padding:12px;border-radius:6px;margin:12px 0}.hidden{display:none}.kicker{letter-spacing:1.2px;font-size:10px;text-transform:uppercase;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:160px minmax(0,1fr)}main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){header{padding:8px;height:auto;flex-wrap:wrap;gap:8px}.shell{display:block}aside{border:0;padding:8px}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto;font-size:12px}.brand{font-size:14px}main{padding:12px}.panel{padding:12px}}
</style></head><body><header><div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 35 12v16L20 37 5 28V12Z M20 12l8 5v8l-8 5-8-5v-8Z M20 30v7M5 12l7 5M35 12l-7 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Delivery Orchestrator</div><div class="row"><small>● DEMO · Synthetic data</small><button id="theme">Light mode</button></div></header><div class="shell"><aside><div class="kicker">Workspace</div><nav id="nav"></nav><div class="section kicker">Local control center</div><small>Design prototype v0.1<br>No remote connections</small></aside><main id="main"></main></div><script>
const pages=['Overview','Delivery Details','Action Center','Execution Inspector'];let page=0,cycle=2,selected=7,decision='',checks=[false,false,false],branch='develop',branchDone=false;const $=id=>document.getElementById(id);const steps=['Preparation & governance','Local code review','Granular commits & MR','Monitor GitLab','Review findings','Pipeline evidence','Correction plan','Human validation','Commit & push','Quality gates','Learning'];const data=[['DX-028','Entity details','example-web','Awaiting validation'],['DX-029','Offline sync','example-mobile','Monitoring review'],['DX-027','Filter behavior','example-web','Completed']];const status=(t,c)=>`<span class="tag ${c}">${t}</span>`;function go(i){page=i;render()}function metric(t,v,d){return `<div class="panel"><small>${t}</small><div class="metric">${v}</div><small>${d}</small></div>`}function top(t,d){return `<div class="kicker">Workspace / ${t}</div><h1>${t}</h1><p class="muted">${d}</p>`}function render(){ $('nav').innerHTML=pages.map((p,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${p}${i===2&&!decision?' · 2':''}</button>`).join('');let html='';if(page===0){html=top('Engineering overview','Monitor delivery activity and focus on decisions that need you.')+`<div class="grid">${metric('Active deliveries','02','Across two projects')}${metric('Action required',String((decision?0:1)+(branchDone?0:1)).padStart(2,'0'),'Human decisions')}${metric('Completed','18','Illustrative history')}${metric('Agent executions','02','Synthetic activity')}</div><div class="split section"><section class="panel"><h2>Deliveries</h2>${data.map((d,i)=>`<button class="delivery" onclick="${i===0?'go(1)':'showOther('+i+')'}"><div class="row"><strong>${d[1]}</strong>${status(i===0?(decision==='approved'?'Validation approved':decision==='rejected'?'Correction requested':d[3]):d[3],i===0?'warn':i===1?'run':'good')}</div><small>${d[0]} · ${d[2]}</small></button>`).join('')}<div id="other"></div></section><section class="panel"><h2>Recent activity</h2>${['10:38 · Human validation requested','10:37 · 32 local tests passed','10:35 · Corrections implemented','10:30 · 4 findings received'].map(x=>`<div class="line">${x}</div>`).join('')}</section></div>`}else if(page===1){html=top('Entity details','DX-028 · example-web · MR !142')+`<div class="row"><span class="mono">feature/entity-details → develop</span>${status(cycle===1?'✓ Historical cycle':decision==='approved'?'✓ Validation approved':decision==='rejected'?'Correction requested':'◷ Awaiting human validation',cycle===1?'good':'warn')}<select aria-label="Review cycle" onchange="cycle=Number(this.value);selected=cycle===1?4:7;render()"><option value="2" ${cycle===2?'selected':''}>Cycle 2 (current)</option><option value="1" ${cycle===1?'selected':''}>Cycle 1 (history)</option></select></div><div class="grid section">${metric('Published SHA',cycle===2?'8f3a21c':'1ab09ce','Remote branch')}${metric('CI validated SHA',cycle===2?'8f3a21c':'1ab09ce','✓ Pipeline passed')}${metric('Local snapshot',cycle===2?'c4d901e':'1ab09ce',cycle===2?'Unpublished changes':'Historical snapshot')}${metric('Findings',cycle===2?'4':'2','Corrections prepared')}</div><div class="split section"><section class="panel"><h2>Workflow execution</h2>${steps.map((s,i)=>{let st=cycle===1?(i<=8?'✓ Completed':'○ Not reached'):i<7?'✓ Completed':i===7?(decision==='approved'?'✓ Approved':decision==='rejected'?'↺ Rejected':'◷ Awaiting you'):'○ Pending';return `<button class="node ${selected===i?'selected':''}" onclick="selected=${i};render()"><span>${s}</span>${status(st,st.startsWith('✓')?'good':i===7?'warn':'muted')}</button>${i===8?'<div class="loop">↳ Publish → return to monitoring for a new cycle</div>':i<10?'<div class="arrow">↓</div>':''}`}).join('')}</section><section class="panel"><h2>Step inspector</h2><small>Cycle ${cycle} · Step ${selected+1}</small><h3>${steps[selected]}</h3><p>${selected===7?'Validation is tied to the exact local snapshot. Remote CI does not cover unpublished corrections.':selected===5?'Pipeline evidence is associated with the published SHA.':selected===4?'Findings include origin, evidence and disposition.':'Inspect recorded execution evidence and status.'}</p><button onclick="go(3)">Open execution inspector</button>${cycle===2&&selected===7?'<div class="section"><button class="primary" onclick="go(2)">Open human action</button></div>':''}<div class="notice"><small>All evidence shown is simulated. No real GitLab state.</small></div></section></div>`}else if(page===2){html=top('Action Center','Explicit decisions. Never approve an outdated snapshot.')+`<div class="split"><section class="panel"><div class="row"><h2>Validate corrections</h2>${status(decision||'Pending','warn')}</div><small>DX-028 · Cycle 2 · local snapshot c4d901e</small><p>Four findings addressed. 32 local tests passed. Corrections are not published.</p><div class="checks">${['Verify entity detail rendering','Validate filter behavior','Verify error handling'].map((s,i)=>`<label><input type="checkbox" ${checks[i]?'checked':''} ${decision?'disabled':''} onchange="checks[${i}]=this.checked;render()"> ${s}</label>`).join('')}</div><div class="row section"><button ${decision?'disabled':''} onclick="decision='rejected';render()">Request changes</button><button class="primary" ${decision||!checks.every(Boolean)?'disabled':''} onclick="decision='approved';render()">Approve snapshot</button></div>${decision?`<div class="notice">${decision==='approved'?'Simulated approval recorded. Next: review, commit and push.':'Simulated rejection. Next: implement adjustments.'} <button onclick="decision='';checks=[false,false,false];render()">Reset</button></div>`:''}</section><section class="panel"><h2>Select target branch</h2><small>DX-030 · feature/example</small><p>Choose an eligible remote branch.</p>${['develop','release/1.8.0','release/1.9.0'].map(b=>`<label style="display:block;padding:8px 0"><input type="radio" name="branch" ${branch===b?'checked':''} ${branchDone?'disabled':''} onchange="branch='${b}';render()"> ${b}</label>`).join('')}<button class="primary" ${branchDone?'disabled':''} onclick="branchDone=true;render()">Confirm target</button>${branchDone?`<p class="good">Simulated selection: ${branch}</p><button onclick="branchDone=false;render()">Reset</button>`:''}</section></div>`}else{html=top('Execution Inspector','Recorded actions and evidence, not hidden model reasoning.')+`<div class="row"><button onclick="go(1)">← Delivery details</button><small>DX-028 · Cycle ${cycle}</small></div><div class="split section"><section class="panel"><h2>Local validation execution</h2><div class="row"><span class="mono">exec-0042</span>${status('✓ Succeeded','good')}</div><p class="muted">Finding / Test runner · 10:35–10:37 · 2m 12s</p>${['Load project rules','Run Finding review','Run lint','Run typecheck','Run unit tests'].map((s,i)=>`<div class="line row"><span>${s}</span>${status('✓ Passed','good')}</div>`).join('')}<h3 class="section">Sanitized output</h3><pre>[10:35:02] Rules loaded\n[10:35:18] Finding: no unresolved local blockers\n[10:36:01] Typecheck: exit 0\n[10:37:14] Tests: 32 passed, 0 failed</pre></section><section class="panel"><h2>Evidence</h2><p>Snapshot <span class="mono">c4d901e</span></p><p>Rule profile: example-web</p><p>Provider: simulated agent</p><div class="notice">Synthetic logs. Actual execution, tool provenance and redaction will require implementation.</div></section></div>`} $('main').innerHTML=html}function showOther(i){$('other').innerHTML=`<div class="notice">${data[i][1]} · ${data[i][3]}. Detailed prototype is available for DX-028 only.</div>`} $('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark mode':'Light mode'};render();</script></body></html>
